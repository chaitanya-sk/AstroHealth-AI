name: Deploy AstroHealth AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'finialspace/new frontend/package-lock.json'

      - name: Install dependencies
        working-directory: './finialspace/new frontend'
        run: npm ci

      - name: Build application
        working-directory: './finialspace/new frontend'
        env:
          VITE_BASE_PATH: '/AstroHealth-AI/'
        run: npm run build

      - name: Add .nojekyll
        working-directory: './finialspace/new frontend/dist'
        run: touch .nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './finialspace/new frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
